<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Diary</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../styles/styles.css" />
  </head>
  <body class="bg-gradient-to-b from-gray-900 via-gray-800 to-black">
    <nav
      class="relative after:pointer-events-none after:absolute after:inset-x-0 after:bottom-0 after:h-px after:bg-white/10"
    >
      <div class="mx-auto max-w-15xl px-2 sm:px-6 lg:px-8">
        <div class="relative flex h-16 items-center justify-between">
          <div
            class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start"
          >
            <div class="flex shrink-0 items-center text-gray-200">
              <i class="fa-solid fa-film text-2xl text-gray-200"></i>
              &nbsp; Playcine
            </div>
            <div class="hidden sm:ml-6 sm:block">
              <div class="flex space-x-4">
                <a
                  href="#"
                  aria-current="page"
                  class="rounded-md bg-gray-950/50 px-3 py-2 text-sm font-medium text-white"
                  >Home</a
                >
                <a
                  href="./journal.html"
                  class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-white/5 hover:text-white"
                  >Journal</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </nav>
    <section class="relative pb-20 flex items-start overflow-visible" id="hero">
      <div
        class="absolute inset-0 bg-cover bg-center filter brightness-50"
      ></div>
      <div class="z-10 text-center w-full mt-10">
        <p class="text-lg md:text-2xl text-gray-100 mb-8">
          Find your favorite movies instantly...
        </p>
        <div class="relative w-full max-w-4xl mx-auto isolate">
          <div class="relative">
            <input
              id="search-textbox"
              type="text"
              placeholder="Search for movies or TV shows..."
              class="w-full px-4 py-3 pl-12 text-gray-200 placeholder-gray-500 border-2 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-500"
              autocomplete="off"
            />
            <svg
              class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              ></path>
            </svg>

            <!-- Clear Button (hidden by default) -->
            <button
              id="clear-search"
              class="hidden absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-100 hover:text-gray-400 transition"
              aria-label="Clear search"
            >
              <svg
                class="w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                ></path>
              </svg>
            </button>
          </div>
          <!-- Autocomplete Results Dropdown -->
          <ul
            id="search-results"
            class="hidden absolute z-9999 w-full mt-2 bg-white border border-gray-200 rounded-lg shadow-lg max-h-96 overflow-y-auto"
          >
            <!-- Results will be dynamically inserted here -->
          </ul>
        </div>
      </div>
    </section>

    <!-- Cards container section -->
    <section id="search-results-block" class="w-full my-10 hidden">
      <h2 class="text-lg md:text-3xl text-gray-100 mb-8 text-center">
        Search Results
      </h2>
      <div
        id="search-results-card-container"
        class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 px-4"
      >
        <!-- cards will be inserted here -->
      </div>
    </section>

    <section id="popular-movies-block" class="w-full my-10">
      <h2 class="text-lg md:text-3xl text-gray-100 mb-8 text-center">
        Popular Movies
      </h2>

      <div class="relative max-w-8xl mx-auto">
        <!-- Left Arrow -->
        <button
          class="prev-btn absolute left-4 top-1/2 -translate-y-1/2 z-10 bg-black/40 hover:bg-black/80 text-white p-4 rounded-full text-xl"
        >
          ◀
        </button>

        <!-- Slider -->
        <div
          id="popular-movies-card-container"
          class="flex-nowrap movie-slider flex gap-4 px-4 overflow-x-auto overflow-y-hidden scroll-smooth no-scrollbar"
        >
          <!-- cards will be inserted here -->
        </div>

        <!-- Right Arrow -->
        <button
          class="next-btn absolute right-4 top-1/2 -translate-y-1/2 z-10 bg-black/40 hover:bg-black/80 text-white p-4 rounded-full text-xl"
        >
          ▶
        </button>
      </div>
    </section>

    <section id="latest-release-block" class="w-full my-10">
      <h2 class="text-lg md:text-3xl text-gray-100 mb-8 text-center">
        Latest Releases
      </h2>

      <div class="relative max-w-8xl mx-auto">
        <!-- Left Arrow -->
        <button
          class="prev-btn absolute left-4 top-1/2 -translate-y-1/2 z-10 bg-black/40 hover:bg-black/80 text-white p-4 rounded-full text-xl"
        >
          ◀
        </button>

        <!-- Slider -->
        <div
          id="latest-release-card-container"
          class="flex-nowrap movie-slider flex gap-2 px-4 overflow-x-auto overflow-y-hidden scroll-smooth no-scrollbar"
        >
          <!-- cards will be inserted here -->
        </div>

        <!-- Right Arrow -->
        <button
          class="next-btn absolute right-4 top-1/2 -translate-y-1/2 z-10 bg-black/40 hover:bg-black/80 text-white p-4 rounded-full text-xl"
        >
          ▶
        </button>
      </div>
    </section>

    <section id="all-movies-block" class="w-full my-10">
      <h2 class="text-lg md:text-3xl text-gray-100 mb-8 text-center">
        All Movies
      </h2>

      <div class="relative max-w-8xl mx-auto">
        <!-- Left Arrow -->
        <button
          class="prev-btn absolute left-4 top-1/2 -translate-y-1/2 z-10 bg-black/40 hover:bg-black/80 text-white p-4 rounded-full text-xl"
        >
          ◀
        </button>
        <!-- Slider -->
        <div
          id="all-movies-card-container"
          class="flex-nowrap movie-slider flex gap-4 px-4 overflow-x-auto overflow-y-hidden scroll-smooth no-scrollbar"
        >
          <!-- cards will be inserted here -->
        </div>

        <!-- Right Arrow -->
        <button
          class="next-btn absolute right-4 top-1/2 -translate-y-1/2 z-10 bg-black/40 hover:bg-black/80 text-white p-4 rounded-full text-xl"
        >
          ▶
        </button>
      </div>
    </section>
    <!-- End of cards container section -->
    <script type="module" src="../js/index.js"></script>
  </body>
  <footer class="rounded-md bg-gray-950/50 px-3 py-2 text-sm font-medium text-white text-center mb-4">
    &copy; 2026 Playcine. All rights reserved.
</html>
